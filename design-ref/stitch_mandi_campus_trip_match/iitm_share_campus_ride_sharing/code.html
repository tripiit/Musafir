<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-deep-navy mb-stack-sm tracking-tight">IITM Share</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Connect with fellow campus travelers</p>
</div>
<!-- Form Section -->
<form action="#" class="space-y-stack-md" method="POST" onsubmit="event.preventDefault(); this.querySelector('button').classList.add('scale-95'); setTimeout(() =&gt; this.querySelector('button').classList.remove('scale-95'), 150);">
<div class="space-y-stack-sm">
<label class="font-label-md text-label-md text-on-surface block" for="email">Institute Email</label>
<div class="relative group focus-within:ring-2 ring-deep-navy/20 rounded-lg transition-all duration-200">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input autocomplete="username" class="block w-full pl-10 pr-[140px] py-3 bg-surface border border-outline-variant rounded-lg focus:border-deep-navy focus:ring-1 focus:ring-deep-navy focus:bg-snow-white transition-colors duration-200 font-body-md text-body-md text-on-surface placeholder-outline-variant" id="email" name="email" placeholder="b20123" required="" type="text">
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<span class="font-body-md text-[14px] text-asphalt-gray select-none">@iitmandi.ac.in</span>
</div>
</div>
<p class="font-label-sm text-label-sm text-asphalt-gray flex items-center gap-1 mt-1 md:font-headline-lg">
<span class="material-symbols-outlined text-[14px]" data-icon="info">info</span>
                        Use your institute email only
                    </p>
</div>

<span class="">Continue to Dashboard</span>
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Bottom decorative line -->
<div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-deep-navy via-surface-tint to-mountain-amber"></div>
</div>
