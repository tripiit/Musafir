<body class="bg-surface text-on-surface min-h-screen flex flex-col antialiased relative overflow-hidden">
<!-- TopAppBar -->

<div class="flex items-center gap-stack-sm text-primary">

<h1 class="text-headline-md font-headline-md font-bold text-primary flex-1 text-center">TripMate IITM</h1>
<div class="flex items-center gap-stack-sm text-primary">
<!-- No trailing icon for auth screens -->
</div>
</header>
<!-- Main Content Canvas (Linear/Transactional intent -> Nav Shell suppressed) -->
<main class="flex-1 flex flex-col justify-center items-center px-margin-mobile pt-stack-xl pb-stack-lg z-10 relative">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_12px_32px_rgba(0,12,50,0.15)] p-stack-lg border border-surface-variant flex flex-col items-center">

<span class="material-symbols-outlined text-[32px] text-primary" style="font-variation-settings: 'FILL' 1;">mark_email_read</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary text-center mb-stack-xs">Verify your email</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-stack-lg">
                Enter the 6-digit verification code we sent to<br>
<strong class="text-on-surface">user@students.iitmandi.ac.in</strong>
</p>
<form class="w-full flex flex-col items-center" id="otpForm">
<div class="flex gap-2 justify-center w-full mb-stack-md" dir="ltr">
<input autofocus="" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-lg font-headline-lg bg-surface-container-low border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest rounded-lg outline-none transition-colors" data-index="0" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-lg font-headline-lg bg-surface-container-low border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest rounded-lg outline-none transition-colors" data-index="1" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-lg font-headline-lg bg-surface-container-low border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest rounded-lg outline-none transition-colors" data-index="2" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-lg font-headline-lg bg-surface-container-low border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest rounded-lg outline-none transition-colors" data-index="3" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-lg font-headline-lg bg-surface-container-low border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest rounded-lg outline-none transition-colors" data-index="4" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-lg font-headline-lg bg-surface-container-low border-2 border-transparent focus:border-primary focus:bg-surface-container-lowest rounded-lg outline-none transition-colors" data-index="5" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">

                    </span>

            </button>

<!-- Background Decoration -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] bg-primary-fixed-dim rounded-full blur-[120px] opacity-20"></div>
<div class="absolute bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-secondary-fixed-dim rounded-full blur-[100px] opacity-10"></div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            const form = document.getElementById('otpForm');

            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value.length === 1) {
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        }
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '') {
                        if (index > 0) {
                            inputs[index - 1].focus();
                        }
                    }
                });
                
                // Allow pasting
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').slice(0, 6).replace(/[^0-9]/g, '');
                    if(pastedData) {
                        const digits = pastedData.split('');
                        digits.forEach((digit, i) => {
                            if(inputs[i]) {
                                inputs[i].value = digit;
                                if(i < inputs.length -1) {
                                    inputs[i+1].focus();
                                }
                            }
                        });
                    }
                });
            });

            // Resend timer simulation
            const resendBtn = document.getElementById('resendBtn');
            let timeLeft = 59;
            resendBtn.disabled = true;

            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    resendBtn.textContent = 'Resend Code';
                    resendBtn.disabled = false;
                } else {
                    resendBtn.textContent = `Resend Code (${timeLeft}s)`;
                }
            }, 1000);
        });
    </script>
