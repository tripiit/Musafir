<script>
        // Extremely basic swipe interaction mockup for visual demonstration
        const card = document.getElementById('active-card');
        let startX = 0;
        let currentX = 0;

        card.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            card.style.transition = 'none';
        });

        card.addEventListener('touchmove', (e) => {
            currentX = e.touches[0].clientX - startX;
            // Limit the drag distance slightly for visual feel
            card.style.transform = `translateX(${currentX * 0.5}px) rotate(${currentX * 0.05}deg)`;
            
            // Optional opacity change based on drag direction
            if(Math.abs(currentX) > 50) {
                 // visual hint but keep simple
            }
        });

        card.addEventListener('touchend', (e) => {
            card.style.transition = 'transform 0.3s ease-out, opacity 0.3s ease-out';
            if (Math.abs(currentX) > 100) {
                // Swipe out
                card.style.transform = `translateX(${currentX > 0 ? window.innerWidth : -window.innerWidth}px) rotate(${currentX > 0 ? 20 : -20}deg)`;
                card.style.opacity = '0';
                
                // Reset for demo purposes
                setTimeout(() => {
                    card.style.transition = 'none';
                    card.style.transform = 'translateX(0) rotate(0)';
                    card.style.opacity = '1';
                }, 300);
            } else {
                // Snap back
                card.style.transform = 'translateX(0) rotate(0)';
            }
            currentX = 0;
        });
    </script>
